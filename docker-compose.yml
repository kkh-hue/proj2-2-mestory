# 필수 조건 2 — `docker compose up` 한 줄로 전체 서비스가 떠야 합니다.
# 필요 없는 서비스는 지우고, 필요한 것(redis 등)은 추가하세요.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 이미지에는 CSV(data/)가 없어서 컨테이너 안에서는 csv 모드가 동작할 수 없다.
    # environment는 env_file보다 우선하므로 .env에 csv가 남아 있어도 db로 고정된다.
    environment:
      MESTORY_DATA_SOURCE: db
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64
